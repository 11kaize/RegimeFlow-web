services:
  - type: web
    name: regimeflow-web
    runtime: python
    rootDir: .
    buildCommand: pip install --no-cache-dir torch --index-url https://download.pytorch.org/whl/cpu && pip install --no-cache-dir -r web/backend/requirements.txt
    startCommand: cd web/backend && python server.py
    envVars:
      - key: LOAD_CHRONOS
        value: "false"
      - key: LOAD_REGIMEFLOW
        value: "true"
      - key: REGIMEFLOW_STEPS
        value: "4"
      - key: PORT
        value: "8000"
      - key: OMP_NUM_THREADS
        value: "1"
      - key: MKL_NUM_THREADS
        value: "1"
