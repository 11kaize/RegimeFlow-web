<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegimeFlow — Biological Trajectory Forecasting</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<link rel="stylesheet" href="css/style.css?v=20">
<script src="data/i18n.js?v=6"></script>
<script src="data/model-display-names.js?v=1"></script>
<script src="js/i18n.js?v=4"></script>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <a href="/" class="nav-logo">RegimeFlow</a>
  <div class="nav-links">
    <button class="nav-btn active" data-view="taxonomy">Models</button>
    <button class="nav-btn" data-view="predict" data-i18n="nav.predict">Prediction</button>
    <a href="https://github.com/hengrao02/RegimeFlow" target="_blank" class="nav-btn">GitHub ↗</a>
  </div>
</nav>

<!-- Taxonomy Circle Packing 视图（默认首页） -->
<div id="view-taxonomy" class="view active">
  <section class="hero-compact" style="text-align:center;max-width:80%;margin:0 auto;">
    <h1 data-i18n="overview.heroTitle" style="text-align:center;display:block;width:100%;">Taxonomic Composition</h1>
    <p class="hero-sub" style="text-align:center;">1,050 Biological Models</p>
  </section>

  <!-- 全局搜索栏 -->
  <div id="tax-global-search-bar" style="max-width:640px;margin:0 auto 10px;position:relative;">
    <input id="tax-global-search" type="text" placeholder="Search by keyword — name, domain, regime, process…"
      style="width:100%;padding:10px 16px;font-size:14px;background:#1a2a3a;border:1px solid #2a4057;
        border-radius:10px;color:#e0e6ed;outline:none;box-sizing:border-box;">
    <div id="tax-global-results" style="display:none;position:absolute;top:100%;left:0;right:0;z-index:20;
      background:#162231;border:1px solid #2a4057;border-radius:0 0 10px 10px;
      max-height:320px;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,0.5);"></div>
  </div>

  <div id="taxonomy-pack-container" style="max-width:96%;margin:0 auto;padding:4px 0;">
    <div id="taxonomy-pack-chart" style="width:100%;height:78vh;min-height:560px;max-height:900px;overflow:hidden;"></div>

    <!-- Domain list table (shown when a large domain is clicked) -->
    <div id="taxonomy-table-view" style="display:none;">
      <div class="cg-topbar">
        <button id="tax-table-back" class="btn-back-all">← Back to Bubbles</button>
        <span id="tax-table-title" class="cg-title"></span>
        <div class="cg-actions">
          <select id="tax-table-filter" class="cg-sort">
            <option value="all">All Regimes</option>
            <option value="oscillation">Oscillation</option>
            <option value="inc_stable">Increasing Stable</option>
            <option value="dec_stable">Decreasing Stable</option>
            <option value="directly_stable">Direct Stable</option>
          </select>
          <input id="tax-table-search" class="cg-search" placeholder="Search by name or ID…" />
          <select id="tax-table-sort" class="cg-sort">
            <option value="name">By Name</option>
            <option value="species">By Species</option>
            <option value="id">By ID</option>
          </select>
        </div>
      </div>
      <div id="tax-stats-bar" class="tax-stats-bar">
        <span id="tax-stats-text" class="tax-stats-text"></span>
        <div class="tax-batch-actions">
          <button id="tax-select-all" class="tax-action-btn">☐ Select all</button>
          <button id="tax-download" class="tax-action-btn">⬇ Download CSV</button>
        </div>
      </div>
      <div id="tax-table-grid" class="tax-table"></div>
      <div id="tax-table-pagination" class="tax-pagination"></div>
    </div>
  </div>
  <div id="tax-mode-bar" style="display:flex;justify-content:center;align-items:center;gap:8px;padding:10px 0 4px;">
    <button class="tax-mode-btn active" data-mode="taxonomy">🧬 Taxonomy</button>
    <button class="tax-mode-btn" data-mode="processes">🧪 Biological Processes</button>
  </div>

  <div id="taxonomy-hint" style="text-align:center;padding:8px;color:#8899aa;font-size:12px;">
    Click a circle to zoom in · Click background to zoom out
  </div>
</div>

<!-- Prediction视图 -->
<div id="view-predict" class="view">
  <div class="view-header">
    <h2 data-i18n="predict.title">Prediction演示</h2>
  </div>
  <div class="predict-layout">
    <div class="predict-sidebar">
      <div class="input-tabs">
        <button class="input-tab active" data-tab="models" data-i18n="predict.tabModels">Models</button>
        <button class="input-tab" data-tab="custom" data-i18n="predict.tabCustom">Custom Data</button>
      </div>
      <div id="system-list">
        <div class="dim-tabs">
          <button class="dim-tab active" data-dim="taxonomy">🧬 Taxonomy</button>
          <button class="dim-tab" data-dim="process">🧪 Biological Process</button>
        </div>
        <select id="category-filter" class="pw-filter-select" aria-label="Filter models"></select>
        <div id="pw-model-list"></div>
      </div>
      <div id="custom-input-panel" style="display:none;">
        <label class="input-label" data-i18n="predict.inputLabel">粘贴时序数据（每行一个值，或 time,value 两列）</label>
        <textarea id="custom-data-input" data-i18n-placeholder="predict.inputPlaceholder" placeholder="例如：&#10;0, 1.2&#10;0.1, 1.5&#10;0.2, 1.8&#10;0.3, 2.1&#10;...&#10;（至少10个数据点）"></textarea>
        <div class="input-row">
          <label data-i18n="predict.ctxLen">上下文长度:</label>
          <input type="number" id="custom-ctx-len" value="96" min="10" max="500" step="1">
          <span class="input-unit" data-i18n="predict.ctxUnit">个点</span>
        </div>
        <button id="btn-custom-predict" class="btn-predict-custom" data-i18n="predict.btnPredict">🔮 开始预测</button>
        <div class="input-hint">
          <span data-i18n="predict.inputHint">前 N 个点 = 输入轨迹（蓝色）· 剩余 = 对比基准（灰色虚线）<br>支持 CSV / TSV / 纯数值格式</span>
        </div>
        <div id="custom-status" class="custom-status"></div>
      </div>
      <div class="sidebar-note" data-i18n="predict.sidebarNote">
        🔄 正在连接后端…<br>点击物种自动调用<br>Chronos-Bolt API 预测。
      </div>
    </div>
    <div class="predict-main">
      <div id="predict-chart"></div>
      <div class="chart-legend-guide" id="chart-legend-guide" style="display:none;">
        <span class="legend-item"><span class="legend-swatch" style="background:#6a8299;border-style:dashed;"></span> Actual</span>
        <span class="legend-sep">·</span>
        <span class="legend-item"><span class="legend-swatch" style="background:#F39C12;"></span> Prediction</span>
      </div>
      <div class="predict-controls">
        <button id="btn-back-to-list" class="btn-back-list" style="display:none;">← 返回列表</button>
        <label data-i18n="predict.selectSpecies">选择物种:</label>
        <select id="species-select"></select>
        <span class="regime-tag" id="regime-tag"></span>
      </div>
    </div>
  </div>
</div>

<!-- 模型详情侧边栏 -->
<div id="detail-panel" class="detail-panel">
  <button class="detail-close" onclick="closeDetailPanel()">&times;</button>
  <div id="detail-content"></div>
</div>
<div id="detail-overlay" class="detail-overlay" onclick="closeDetailPanel()"></div>

<!-- 模型详情模态框 -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <button class="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<!-- 全局「返回泡泡图」按钮（在泡泡图视图上自动隐藏） -->
<button id="btn-back-to-bubbles" class="btn-back-bubbles" style="display:none;">← Back to Home</button>

<script src="js/core/utils.js?v=1"></script>
<script src="data/regime-mappings.js?v=1"></script>
<script src="data/pathway-models.js?v=1"></script>
<script src="data/bio-models.js?v=5"></script>
<script src="data/bio-domains.js?v=1"></script>
	<script src="data/bio-processes.js?v=3"></script>
<script src="js/components/detail-panel.js?v=4"></script>
<script src="js/components/skeleton.js?v=1"></script>
<script src="js/prediction.js?v=31"></script>
<script src="js/taxonomy-pack.js?v=25"></script>
<script>
// ---- Taxonomy (default page) ----
(function() {
  if (typeof BIO_MODELS_DATA !== 'undefined' && typeof BIO_DOMAIN_DATA !== 'undefined') {
    setTimeout(function() { initTaxonomyPack(null, 'taxonomy-pack-chart'); }, 100);
  }
})();

initPrediction();

// ---- Navigation ----
function setView(viewName) {
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.view === viewName));
  document.querySelectorAll('.view').forEach(v => v.classList.toggle('active', v.id === 'view-' + viewName));

  var back = document.getElementById('btn-back-to-bubbles');
  if (back) back.style.display = (viewName === 'taxonomy') ? 'none' : '';

  if (viewName === 'taxonomy') setTimeout(function() { resizeTaxonomyPack(); }, 100);
  if (viewName === 'predict') setTimeout(() => window._predictChart && window._predictChart.resize(), 200);
}

document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
  btn.addEventListener('click', () => setView(btn.dataset.view));
});

document.getElementById('btn-back-to-bubbles').addEventListener('click', () => setView('taxonomy'));

// ---- Modal ----
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.querySelector('.modal-close').addEventListener('click', closeModal);

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}
</script>
</body>
</html>
