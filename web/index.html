<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RegimeFlow — Biological Trajectory Forecasting</title>
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
<link rel="stylesheet" href="css/style.css?v=4">
<script src="data/i18n.js?v=4"></script>
<script src="js/i18n.js?v=4"></script>
</head>
<body>

<!-- 导航栏 -->
<nav class="navbar">
  <a href="/" class="nav-logo">RegimeFlow</a>
  <div class="nav-links">
    <button class="nav-btn active" data-view="bubble" data-i18n="nav.graph">Models</button>
    <button class="nav-btn" data-view="predict" data-i18n="nav.predict">Prediction</button>
    <a href="https://github.com/hengrao02/RegimeFlow" target="_blank" class="nav-btn">GitHub ↗</a>
    <button id="lang-switch" class="nav-btn lang-switch" onclick="toggleLang()">EN</button>
  </div>
</nav>

<!-- 泡泡图视图（默认首页） -->
<div id="view-bubble" class="view active">

  <!-- 标题 -->
  <section class="hero-compact" style="text-align:center;max-width:80%;margin:0 auto;">
    <h1 data-i18n="overview.heroTitle" style="text-align:center;display:block;width:100%;">Cross-System Trajectory</h1>
    <p class="hero-sub" data-i18n="overview.heroSub" style="text-align:center;">Prediction for 1000+ Biological Systems</p>
  </section>

  <!-- 气泡图 — 占页面主体 -->
  <div class="bubble-container">
    <div id="family-nav" class="family-nav" style="display:none;">
      <button id="btn-back-all" class="btn-back-all">← Back</button>
      <span id="family-name" class="family-name"></span>
    </div>
    <div id="bubble-chart"></div>

    <!-- 卡片网格视图 (Level 3) -->
    <div id="card-grid-view" class="card-grid-view" style="display:none;">
      <div class="cg-topbar">
        <button id="cg-back" class="btn-back-all">← Back</button>
        <span id="cg-title" class="cg-title"></span>
        <div class="cg-actions">
          <select id="cg-filter" class="cg-sort">
            <option value="all">All Sizes</option>
            <option value="micro">Micro (1–10)</option>
            <option value="small">Small (11–30)</option>
            <option value="medium">Medium (31–100)</option>
            <option value="large">Large (100+)</option>
          </select>
          <input id="cg-search" class="cg-search" placeholder="Search models…" />
          <select id="cg-sort" class="cg-sort">
            <option value="name">By Name</option>
            <option value="species">By Species</option>
            <option value="year">By Year</option>
          </select>
        </div>
      </div>
      <div id="cg-grid" class="cg-grid"></div>
      <div id="cg-pagination" class="cg-pagination"></div>
    </div>
  </div>

  <!-- 链接 — 图表下方 -->
  <div class="links-below">
    <div class="ov-hero-links">
      <a href="https://openreview.net/forum?id=sI3UUkXJxs" target="_blank" class="ov-btn ov-btn-primary" data-i18n="overview.paperBtn">Paper (OpenReview)</a>
      <a href="https://github.com/hengrao02/RegimeFlow" target="_blank" class="ov-btn" data-i18n="overview.codeBtn">GitHub Repository</a>
      <a href="https://huggingface.co/datasets/HengRao/SysBio-Traj" target="_blank" class="ov-btn" data-i18n="overview.datasetBtn">Dataset (HuggingFace)</a>
    </div>
    <a href="#" class="ov-demo-link" onclick="document.querySelector('.nav-btn[data-view=predict]').click(); return false;" data-i18n="overview.demoBtn">🔬 试试在线预测 →</a>
  </div>

</div>

<!-- Prediction视图 -->
<div id="view-predict" class="view">
  <div class="view-header">
    <h2 data-i18n="predict.title">Prediction演示</h2>
  </div>
  <div class="predict-layout">
    <div class="predict-sidebar">
      <div class="input-tabs">
        <button class="input-tab active" data-tab="examples" data-i18n="predict.tabExamples">示例系统</button>
        <button class="input-tab" data-tab="custom" data-i18n="predict.tabCustom">自定义数据</button>
      </div>
      <div id="system-list"></div>
      <div id="custom-input-panel" style="display:none;">
        <label class="input-label" data-i18n="predict.inputLabel">粘贴时序数据（每行一个值，或 time,value 两列）</label>
        <textarea id="custom-data-input" data-i18n-placeholder="predict.inputPlaceholder" placeholder="例如：&#10;0, 1.2&#10;0.1, 1.5&#10;0.2, 1.8&#10;0.3, 2.1&#10;...&#10;（至少10个数据点）"></textarea>
        <div class="input-row">
          <label data-i18n="predict.ctxLen">上下文长度:</label>
          <input type="number" id="custom-ctx-len" value="96" min="10" max="500" step="1">
          <span class="input-unit" data-i18n="predict.ctxUnit">个点</span>
        </div>
        <button id="btn-custom-predict" class="btn-predict-custom" data-i18n="predict.btnPredict">🔮 开始预测</button>
        <div class="input-hint">
          <span data-i18n="predict.inputHint">前 N 个点 = 上下文（蓝色）· 剩余 = 对比基准（灰色虚线）<br>支持 CSV / TSV / 纯数值格式</span>
        </div>
        <div id="custom-status" class="custom-status"></div>
      </div>
      <div class="sidebar-note" data-i18n="predict.sidebarNote">
        🔄 正在连接后端…<br>点击物种自动调用<br>Chronos-Bolt API 预测。
      </div>
    </div>
    <div class="predict-main">
      <div id="predict-chart"></div>
      <div class="predict-controls">
        <label data-i18n="predict.selectSpecies">选择物种:</label>
        <select id="species-select"></select>
        <span class="regime-tag" id="regime-tag"></span>
      </div>
    </div>
  </div>
</div>

<!-- 模型详情侧边栏 -->
<div id="detail-panel" class="detail-panel">
  <button class="detail-close" onclick="closeDetailPanel()">&times;</button>
  <div id="detail-content"></div>
</div>
<div id="detail-overlay" class="detail-overlay" onclick="closeDetailPanel()"></div>

<!-- 模型详情模态框 -->
<div id="modal-overlay" class="modal-overlay">
  <div class="modal">
    <button class="modal-close">&times;</button>
    <div id="modal-content"></div>
  </div>
</div>

<script src="data/models.js?v=3"></script>
<script src="data/bio-models.js?v=5"></script>
<script src="data/sample_traj.js?v=3"></script>
<script src="js/bubble-chart.js?v=37"></script>
<script src="js/model-detail.js?v=3"></script>
<script src="js/prediction.js?v=7"></script>
<script>
// 初始化
(function() {
  var el = document.getElementById('bubble-chart');
  if (!el) { console.error('bubble-chart element not found'); return; }

  if (typeof d3 === 'undefined') {
    el.innerHTML = '<div style="color:#E74C3C;padding:20px;text-align:center;">❌ D3.js failed to load. Please refresh.</div>';
    return;
  }

  if (typeof BIO_MODELS_DATA === 'undefined') {
    el.innerHTML = '<div style="color:#E74C3C;padding:20px;text-align:center;">❌ Data not loaded (BIO_MODELS_DATA)</div>';
    return;
  }

  try {
    initBubbleChart(BIO_MODELS_DATA, 'bio');
    var svgCount = el.querySelectorAll('svg').length;
    var circleCount = el.querySelectorAll('circle').length;
    if (circleCount === 0) {
      el.insertAdjacentHTML('afterbegin', '<div style="color:#F39C12;padding:10px;text-align:center;font-size:12px;">⚠ Chart rendered but no circles found ('+BIO_MODELS_DATA.length+' models loaded)</div>');
    }
    console.log('Bubble chart: ' + circleCount + ' circles, ' + svgCount + ' SVG(s). Data: ' + BIO_MODELS_DATA.length + ' models. D3: v' + d3.version);
  } catch(e) {
    el.innerHTML = '<div style="color:#E74C3C;padding:20px;text-align:center;">❌ Render error: ' + e.message + '</div>';
    console.error('initBubbleChart error:', e);
  }
})();

initPrediction();

// 导航切换
document.querySelectorAll('.nav-btn[data-view]').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
    document.getElementById('view-' + btn.dataset.view).classList.add('active');
    if (btn.dataset.view === 'predict') setTimeout(() => window._predictChart && window._predictChart.resize(), 200);
  });
});

// 模态框关闭
document.getElementById('modal-overlay').addEventListener('click', e => {
  if (e.target === e.currentTarget) closeModal();
});
document.querySelector('.modal-close').addEventListener('click', closeModal);

function closeModal() {
  document.getElementById('modal-overlay').classList.remove('active');
}
</script>
</body>
</html>
